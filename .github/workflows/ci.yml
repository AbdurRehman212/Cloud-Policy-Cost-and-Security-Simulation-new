name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# Least privilege: every job only reads the repository. No job needs secrets; the database
# passwords below are throwaway values for the CI-only PostgreSQL service containers.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (the comment gives the release).
jobs:
  backend:
    name: Backend tests (PostgreSQL, schema upgrade, Socket.IO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cloud_simulator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/cloud_simulator_test
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests on PostgreSQL (includes migration verification in tests/test_schema_upgrade.py)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Production build (warnings are errors)
        working-directory: frontend
        run: npm run build
        env:
          CI: 'true'

  e2e:
    name: End-to-end tests (Playwright, Chrome)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cloud_simulator_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/cloud_simulator_e2e
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      # PORT is set per step: Create React App also reads PORT, so a job-level value made the dev
      # server take the backend's port.
      - name: Start backend (CI database only)
        working-directory: backend
        run: PORT=5000 nohup python run.py > ../backend-e2e.log 2>&1 &
      - name: Start frontend dev server
        working-directory: frontend
        run: PORT=3000 BROWSER=none nohup npm start > ../frontend-e2e.log 2>&1 &
      - name: Wait for both servers
        run: |
          curl -s -o /dev/null --retry 60 --retry-connrefused --retry-delay 2 http://localhost:5000/api/settings
          curl -s -o /dev/null --retry 90 --retry-connrefused --retry-delay 2 http://localhost:3000/
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Upload logs and Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            backend-e2e.log
            frontend-e2e.log
            e2e/test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Python dependencies (fails on any known vulnerability)
        # PYSEC-2024-110 (scikit-learn < 1.5) concerns TfidfVectorizer storing stop words; the project
        # does not use TfidfVectorizer, and upgrading scikit-learn would change the evaluated model.
        # Documented in docs/ENGINEERING_QUALITY_REPORT.md; remove this ignore when upgrading.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --no-deps --disable-pip --ignore-vuln PYSEC-2024-110
      - name: Frontend production dependencies (fails on critical)
        # The remaining high advisories are inside react-scripts' build toolchain (no fix without
        # replacing react-scripts); they are reported here and tracked in the quality report.
        working-directory: frontend
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
